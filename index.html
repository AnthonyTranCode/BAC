document.addEventListener('keydown', e => {
  const modalOpen = !document.getElementById('modal-bg').classList.contains('hidden');

  // Modal shortcuts
  if (modalOpen) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON'
        && document.activeElement.tagName !== 'SELECT') saveEvent();
    return;
  }

  // Escape dismisses a pending undo; Ctrl/Cmd+Z takes it.
  if (e.key === 'Escape' && _undo) { hideToast(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && _undo) {
    e.preventDefault();
    performUndo();
    return;
  }

  // Zoom keyboard shortcuts (Ctrl/Cmd)
  if (e.ctrlKey || e.metaKey) {
    if (e.key === '=' || e.key === '+') { e.preventDefault(); setZoom(curZoom + ZOOM_STEP); }
    if (e.key === '-' || e.key === '_') { e.preventDefault(); setZoom(curZoom - ZOOM_STEP); }
    if (e.key === '0')                  { e.preventDefault(); fitToWindow(); }
  }
});

// ── Today ────────────────────────────────────────────────────
function goToToday() {
  const t = todayStr();
  const { year } = parseDate(t);

  // Today may fall outside the planner's range; the button is disabled then.
  if (year < YEAR_MIN || year > YEAR_MAX) return;
  if (year !== curYear) setYear(year);

  const cell = document.querySelector(`.day-cell[data-date="${t}"]`);
  if (!cell) return;
  cell.scrollIntoView({
    block: 'center', inline: 'center',
    behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
  });
  cell.focus({ preventScroll: true });
}

function updateTodayBtn() {
  const { year } = parseDate(todayStr());
  const btn = document.getElementById('today-btn');
  const out = year < YEAR_MIN || year > YEAR_MAX;
  btn.disabled = out;
  btn.title = out ? `Today (${year}) is outside this planner` : 'Jump to today';
}

document.getElementById('today-btn').addEventListener('click', goToToday);

// ── Toast wiring ─────────────────────────────────────────────
document.getElementById('toast-undo').addEventListener('click', performUndo);

// ── Zoom ─────────────────────────────────────────────────────
// The calendar defaults to "fit": scaled so the whole year fills the window.
// Any manual zoom leaves fit mode; clicking the percentage returns to it.
let fitMode = true;

function setZoom(z, { keepFit = false } = {}) {
  if (!keepFit) fitMode = false;
  curZoom = Math.round(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)) * 100) / 100;
  document.getElementById('page-scaler').style.zoom = curZoom;
  const pct = document.getElementById('zoom-pct');
  pct.textContent = Math.round(curZoom * 100) + '%';
  pct.title = fitMode ? 'Fitted to window (Ctrl 0)' : 'Fit to window (Ctrl 0)';
}

// Scale at which the year spans the full window width.
//
// Width only, deliberately: the grid is far wider than it is tall, so fitting
// both axes would let height win and leave a third of the window empty to the
// right. A year planner is read across, so width is the axis worth filling —
// if the content is taller than the window, it scrolls vertically.
function computeFitZoom() {
  const outer = document.getElementById('page-outer');
  const grid  = document.getElementById('cal-grid');
  if (!outer || !grid || !grid.firstChild) return curZoom;

  // Derive the intrinsic width from the grid's own geometry rather than
  // measuring the element: .cal-grid stretches to its container, so its
  // rendered width always equals the viewport and the ratio comes out 1.
  const root   = getComputedStyle(document.documentElement);
  const cellW  = parseFloat(root.getPropertyValue('--cell-w'));
  const labelW = parseFloat(root.getPropertyValue('--label-w'));

  const wrap = getComputedStyle(document.getElementById('cal-wrap'));
  const padX = parseFloat(wrap.paddingLeft) + parseFloat(wrap.paddingRight);

  const natW = labelW + 31 * cellW + padX;   // 31 = widest month
  // A zero/NaN measurement (mid-relayout, or a hidden tab) would otherwise
  // clamp the zoom to its 30% floor and stick.
  if (!natW || !outer.clientWidth) return curZoom;
  return outer.clientWidth / natW;
}

function fitToWindow() {
  fitMode = true;
  // Applying a fit can push the content tall enough to add a vertical
  // scrollbar, which takes ~15px off the available width and makes the zoom
  // we just set overflow horizontally. Settle it in at most two passes, and
  // floor rather than round so the rounding itself can never overshoot.
  for (let pass = 0; pass < 2; pass++) {
    const z = Math.floor(computeFitZoom() * 100) / 100;
    if (z === curZoom) break;
    setZoom(z, { keepFit: true });
  }
}

// Re-fit when the window changes size, but only while still in fit mode.
let _fitTimer = null;
window.addEventListener('resize', () => {
  if (!fitMode) return;
  clearTimeout(_fitTimer);
  _fitTimer = setTimeout(fitToWindow, 120);
});

// Zoom bar buttons
document.getElementById('zoom-in') .addEventListener('click', () => setZoom(curZoom + ZOOM_STEP));
document.getElementById('zoom-out').addEventListener('click', () => setZoom(curZoom - ZOOM_STEP));
document.getElementById('zoom-pct').addEventListener('click', fitToWindow);

// Ctrl/Cmd + scroll wheel
window.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  // Smaller delta for trackpad (deltaMode 0), larger for mouse wheel
  const step = Math.abs(e.deltaY) < 50 ? ZOOM_STEP * 0.5 : ZOOM_STEP;
  setZoom(curZoom + (e.deltaY < 0 ? step : -step));
}, { passive: false });

// ── Supabase client ──────────────────────────────────────────
const sb = window.supabase.createClient(
  window.BAC_CONFIG.SUPABASE_URL,
  window.BAC_CONFIG.SUPABASE_KEY
);

let currentUser = null;
const COUNTRIES = ['CA', 'US'];

// ── Local cache helpers ──────────────────────────────────────
// localStorage is a *cache* of the cloud, so the app paints instantly
// and keeps working offline. The cloud is the source of truth.

function localKeys() {
  return Object.keys(localStorage).filter(k => k.startsWith('bac-'));
}

function clearLocalCache() {
  localKeys().forEach(k => localStorage.removeItem(k));
}

function hasLocalPlanData() {
  return Object.keys(localStorage).some(k => {
    if (!k.startsWith('bac-planner-')) return false;
    try { return (JSON.parse(localStorage.getItem(k)) || []).length > 0; }
    catch { return false; }   // corrupt cache must not block sign-in
  });
}

function collectHolidays(y) {
  const out = {};
  COUNTRIES.forEach(c => {
    const raw = localStorage.getItem(holKey(y, c));
    if (raw) { try { out[c] = JSON.parse(raw); } catch {} }
  });
  return out;
}

// ── Sync status dot ──────────────────────────────────────────
function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  dot.classList.remove('pending', 'error');
  if (state === 'pending' || state === 'saving') dot.classList.add('pending');
  if (state === 'error')                        dot.classList.add('error');
  dot.title = {
    saved:   'All changes saved',
    pending: 'Saving…',
    saving:  'Saving…',
    error:   'Could not save — will retry',
  }[state] || '';
}

// ── Outbound sync (debounced) ────────────────────────────────
const _dirtyYears = new Set();
let _dirtyProfile = false;
let _syncTimer    = null;
let _syncing      = false;
let _syncFails    = 0;
const SYNC_MAX_RETRIES = 5;

function queueSync({ year = null, profile = false } = {}) {
  if (!currentUser) return;               // not signed in yet — local only
  if (year != null) _dirtyYears.add(year);
  if (profile)      _dirtyProfile = true;
  _syncFails = 0;                         // a fresh edit deserves a fresh attempt
  setSyncStatus('pending');
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(flushSync, 800); // coalesce rapid edits (e.g. dragging)
}

async function flushSync() {
  if (!currentUser || _syncing) return;

  const years     = [..._dirtyYears]; _dirtyYears.clear();
  const doProfile = _dirtyProfile;    _dirtyProfile = false;
  if (!years.length && !doProfile) return;

  _syncing = true;
  setSyncStatus('saving');
  const stamp = new Date().toISOString();

  try {
    const jobs = [];

    if (years.length) {
      jobs.push(sb.from('plans').upsert(
        years.map(y => ({
          user_id:    currentUser.id,
          year:       y,
          events:     allEvents[y] || [],
          holidays:   collectHolidays(y),
          updated_at: stamp,
        })),
        { onConflict: 'user_id,year' }
      ));
    }

    if (doProfile) {
      jobs.push(sb.from('profiles').upsert({
        user_id:    currentUser.id,
        categories,
        setup_year: curYear,
        updated_at: stamp,
      }, { onConflict: 'user_id' }));
    }

    const failed = (await Promise.all(jobs)).find(r => r.error);
    if (failed) throw failed.error;

    _syncFails = 0;
    setSyncStatus('saved');
  } catch (err) {
    console.error('[sync] save failed:', err);
    _syncFails++;
    if (_syncFails <= SYNC_MAX_RETRIES) {
      // Transient (offline, timeout): put the work back and try again.
      years.forEach(y => _dirtyYears.add(y));
      if (doProfile) _dirtyProfile = true;
    } else {
      // Permanent (revoked account, rejected row): retrying forever would just
      // hammer the server. Stop, and keep the work safe in localStorage — the
      // next edit resets the counter and tries again.
      console.warn('[sync] giving up after', SYNC_MAX_RETRIES, 'retries; data kept locally');
    }
    setSyncStatus('error');
  } finally {
    _syncing = false;
    if (_dirtyYears.size || _dirtyProfile) {
      clearTimeout(_syncTimer);
      // Back off as failures accumulate: 3s, 6s, 12s… capped at 30s.
      const delay = _syncFails ? Math.min(30000, 3000 * 2 ** (_syncFails - 1)) : 800;
      _syncTimer = setTimeout(flushSync, delay);
    }
  }
}

// Don't lose the last edit if the tab closes mid-debounce.
window.addEventListener('beforeunload', () => {
  if (_dirtyYears.size || _dirtyProfile) flushSync();
});

// Catch up after the tab has been backgrounded or the network dropped.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (_dirtyYears.size || _dirtyProfile)) flushSync();
});

// ── Inbound hydration ────────────────────────────────────────
// Pull the user's rows down and write them into the localStorage cache,
// so all the existing synchronous load functions work unchanged.

async function hydrateFromCloud() {
  const [plansRes, profRes] = await Promise.all([
    sb.from('plans').select('year, events, holidays').eq('user_id', currentUser.id),
    sb.from('profiles').select('categories, setup_year').eq('user_id', currentUser.id).maybeSingle(),
  ]);
  if (plansRes.error) throw plansRes.error;
  if (profRes.error)  throw profRes.error;

  const plans = plansRes.data || [];
  const prof  = profRes.data;

  // A brand-new account, on a browser holding a plan built before login:
  // adopt that work instead of discarding it.
  if (!plans.length && !prof && hasLocalPlanData()) {
    console.info('[sync] no cloud data — migrating this browser\'s plan into the new account');
    localStorage.setItem('bac-cache-user', currentUser.id);
    loadCategories();                 // populate `categories` and `allEvents`
    loadAll();                        // *before* deciding what to upload
    allYears()
      .filter(y => (allEvents[y] || []).length)
      .forEach(y => _dirtyYears.add(y));
    _dirtyProfile = true;
    await flushSync();
    return;
  }

  // Otherwise the cloud wins. Drop any cache belonging to a previous user.
  clearLocalCache();

  plans.forEach(row => {
    localStorage.setItem(lsKey(row.year), JSON.stringify(row.events || []));
    Object.entries(row.holidays || {}).forEach(([country, list]) => {
      localStorage.setItem(holKey(row.year, country), JSON.stringify(list));
    });
  });

  if (prof) {
    if (Array.isArray(prof.categories) && prof.categories.length) {
      localStorage.setItem('bac-categories', JSON.stringify(prof.categories));
    }
    if (prof.setup_year) localStorage.setItem('bac-setup-year', String(prof.setup_year));
  }

  localStorage.setItem('bac-cache-user', currentUser.id);
}

// ── Auth UI ──────────────────────────────────────────────────
let authMode = 'signin';

const $gate    = document.getElementById('auth-gate');
const $form    = document.getElementById('auth-form');
const $booting = document.getElementById('auth-booting');
const $toggle  = document.getElementById('auth-toggle');
const $err     = document.getElementById('auth-err');
const $note    = document.getElementById('auth-note');
const $submit  = document.getElementById('auth-submit');

function authError(msg) {
  $err.textContent = msg;
  $err.classList.remove('hidden');
  $note.classList.add('hidden');
}

function authNote(msg) {
  $note.textContent = msg;
  $note.classList.remove('hidden');
  $err.classList.add('hidden');
}

function clearAuthMsgs() {
  $err.classList.add('hidden');
  $note.classList.add('hidden');
}

function showAuthForm() {
  $booting.classList.add('hidden');
  $form.classList.remove('hidden');
  $toggle.classList.remove('hidden');
  $gate.classList.remove('hidden');
}

const AUTH_MODES = {
  signin: {
    sub: 'Sign in to reach your plan', submit: 'Sign in', busy: 'Signing in…',
    email: true, password: true, forgot: true, toggle: true,
    toggleTxt: 'New here?', toggleBtn: 'Create an account',
    autocomplete: 'current-password',
  },
  signup: {
    sub: 'Create an account to save your plan', submit: 'Create account', busy: 'Creating…',
    email: true, password: true, forgot: false, toggle: true,
    toggleTxt: 'Already have an account?', toggleBtn: 'Sign in',
    autocomplete: 'new-password',
  },
  reset: {
    sub: 'We\'ll email you a link to set a new password', submit: 'Send reset link', busy: 'Sending…',
    email: true, password: false, forgot: false, toggle: true,
    toggleTxt: 'Remembered it?', toggleBtn: 'Back to sign in',
    autocomplete: 'current-password',
  },
  newpassword: {
    sub: 'Choose a new password', submit: 'Set new password', busy: 'Saving…',
    email: false, password: true, forgot: false, toggle: false,
    toggleTxt: '', toggleBtn: '',
    autocomplete: 'new-password',
  },
};

function setAuthMode(mode) {
  authMode = mode;
  const m = AUTH_MODES[mode];

  document.getElementById('auth-sub').textContent = m.sub;
  $submit.textContent = m.submit;

  // A hidden field that is still `required` blocks submission entirely and
  // throws "not focusable" — the attribute has to move with the visibility.
  [['auth-field-email', 'auth-email', m.email],
   ['auth-field-password', 'auth-password', m.password]].forEach(([wrap, input, shown]) => {
    document.getElementById(wrap).classList.toggle('hidden', !shown);
    const el = document.getElementById(input);
    if (shown) el.setAttribute('required', '');
    else       el.removeAttribute('required');
  });

  document.getElementById('auth-password').setAttribute('autocomplete', m.autocomplete);
  document.getElementById('auth-forgot').classList.toggle('hidden', !m.forgot);
  document.getElementById('auth-toggle').classList.toggle('hidden', !m.toggle);
  document.getElementById('auth-toggle-txt').textContent = m.toggleTxt;
  document.getElementById('auth-toggle-btn').textContent = m.toggleBtn;

  clearAuthMsgs();
}

document.getElementById('auth-toggle-btn').addEventListener('click', () => {
  setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
});

document.getElementById('auth-forgot-btn').addEventListener('click', () => {
  setAuthMode('reset');
});

$form.addEventListener('submit', async e => {
  e.preventDefault();
  clearAuthMsgs();

  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;

  const mode = authMode;
  $submit.disabled = true;
  $submit.textContent = AUTH_MODES[mode].busy;

  try {
    if (mode === 'reset') {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) throw error;
      // Deliberately the same message whether or not the address is registered,
      // so this form can't be used to discover who has an account.
      setAuthMode('signin');
      authNote('If that email has an account, a reset link is on its way.');
      return;
    }

    if (mode === 'newpassword') {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      _recovering = false;
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) { await startApp(session.user); return; }
      setAuthMode('signin');
      authNote('Password updated. Please sign in.');
      return;
    }

    const { data, error } = mode === 'signup'
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });

    if (error) throw error;

    // With email confirmation ON, signUp returns a user but no session.
    if (mode === 'signup' && !data.session) {
      setAuthMode('signin');
      authNote('Check your email to confirm your account, then sign in.');
      return;
    }
    // onAuthStateChange takes it from here.
  } catch (err) {
    authError(friendlyAuthError(err));
  } finally {
    $submit.disabled = false;
    // authMode may have changed above; label the button for the mode now showing.
    $submit.textContent = AUTH_MODES[authMode].submit;
  }
});

function friendlyAuthError(err) {
  const m = (err && err.message ? err.message : String(err)).toLowerCase();
  if (m.includes('invalid login'))       return 'That email and password combination is not right.';
  if (m.includes('already registered'))  return 'An account with that email already exists — sign in instead.';
  if (m.includes('should be different')) return 'That is your current password — pick a different one.';
  if (m.includes('expired') || m.includes('invalid token') || m.includes('token has'))
    return 'That reset link has expired. Request a new one.';
  if (m.includes('rate limit') || m.includes('too many'))
    return 'Too many attempts. Please wait a minute and try again.';
  if (m.includes('weak') || m.includes('at least'))
    return 'Password must be at least 8 characters.';
  if (m.includes('password'))            return 'Password must be at least 8 characters.';
  if (m.includes('email'))               return 'Please enter a valid email address.';
  if (m.includes('fetch') || m.includes('network'))
    return 'Could not reach the server. Check your connection and try again.';
  return err && err.message ? err.message : 'Something went wrong. Please try again.';
}

document.getElementById('signout-btn').addEventListener('click', async () => {
  if (_dirtyYears.size || _dirtyProfile) await flushSync();
  await sb.auth.signOut();
});

// ── Boot ─────────────────────────────────────────────────────

let _booted     = false;
let _booting    = false;   // guards against overlapping hydrations from duplicate auth events
let _recovering = false;   // true between clicking a reset link and setting the new password

async function startApp(user) {
  if (_booting || _booted) return;   // auth events can arrive twice; hydrate once
  _booting = true;
  currentUser = user;
  const $email = document.getElementById('acct-email');
  $email.textContent = (user.email || '').split('@')[0];   // keep the header compact
  $email.title = user.email || '';

  $booting.textContent = 'Loading your plan…';
  $booting.classList.remove('hidden');
  $form.classList.add('hidden');
  $toggle.classList.add('hidden');

  try {
    await hydrateFromCloud();
  } catch (err) {
    console.error('[sync] load failed:', err);
    authError('Could not load your plan. Check your connection and reload.');
    showAuthForm();
    currentUser = null;
    _booting = false;          // let them retry
    return;
  }

  loadCategories();
  loadAll();
  renderLegend();
  renderCatSelect();

  const savedY = localStorage.getItem('bac-setup-year');
  curYear = (savedY && +savedY >= YEAR_MIN && +savedY <= YEAR_MAX) ? +savedY : 2026;

  updateYearNav();
  updateTodayBtn();
  setSyncStatus('saved');

  // Hide the overlay first so renderCalendar's fit measures the real viewport.
  $gate.classList.add('hidden');
  renderCalendar();

  _booted = true;
}

sb.auth.onAuthStateChange((event, session) => {
  // Arriving from a reset email: Supabase hands us a valid session, but the
  // point is to set a new password — not to walk straight into the app.
  if (event === 'PASSWORD_RECOVERY') {
    _recovering = true;
    history.replaceState(null, '', window.location.pathname);  // strip token from URL
    setAuthMode('newpassword');
    showAuthForm();
    authNote('Enter a new password for your account.');
    return;
  }

  if (session && session.user) {
    if (_recovering || _booted) return;
    startApp(session.user);
    return;
  }

  currentUser = null;
  _booted  = false;
  _booting = false;

  // Only wipe the cache on a genuine sign-out, so one person's plan is never
  // left behind for the next. On INITIAL_SESSION (nobody signed in yet) the
  // cache may hold a plan built before accounts existed — that is the data
  // hydrateFromCloud() migrates into a new account, so it must survive.
  if (event === 'SIGNED_OUT') {
    clearLocalCache();
    allEvents = {};
  }

  document.getElementById('acct-email').textContent = '';
  setAuthMode('signin');
  showAuthForm();
});
</script>
</body>
</html>
